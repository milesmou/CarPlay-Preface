plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 25
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-25'
            }
        }

        consumerProguardFiles 'usb-consumer-rules.pro'

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
// Exercise the actual Release logging policy without assembling an APK.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.hostTests.get(com.android.build.api.variant.HostTestBuilder.UNIT_TEST_TYPE).enable = true
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
